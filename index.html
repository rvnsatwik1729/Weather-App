<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Flex</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="dashboard-wrap">
      <header>
        <div class="logo">
          <img
            src="images/logo.png"
            alt="Weather Flex Logo"
            width="32"
            height="32"
          />
          <h2>Weather Flex</h2>
        </div>
        <button class="units-btn">
          <img src="images/icon-units.svg" alt="" width="16" height="16" />
          <span>units</span>
          <img src="images/icon-dropdown.svg" alt="" width="10" height="10" />
        </button>
      </header>

      <main class="main-content">

        <section class="search-section">
          <h1>How's the sky looking today?</h1>
          <div class="search-bar-container">
            <div class="input-wrapper">
              <img
                src="images/icon-search.svg"
                alt=""
                class="search-icon"
                width="18"
                height="18"
              />
              <input
                type="text"
                placeholder="Search for a place..."
                id="location-input"
              />
            </div>
            <button class="search-submit-btn">Search</button>
          </div>
        </section>

        <div class="weather-content hidden">
          <div class="dashboard-grid">
            <div class="left-panel">
              <div class="hero-weather-card">
                <div class="hero-meta">
                  <h2 class="city-name">Berlin, Germany</h2>
                  <p class="current-date">Tuesday, Aug 5, 2025</p>
                </div>
                <div class="hero-temp-box">
                  <img
                    src="images/icon-sunny.webp"
                    alt="Sunny"
                    width="100"
                    height="100"
                  />
                  <span class="hero-degree">20°</span>
                </div>
              </div>

              <div class="metrics-grid">
                <div class="metric-card">
                  <span class="metric-label">Feels Like</span>
                  <span class="metric-value">18°</span>
                </div>
                <div class="metric-card">
                  <span class="metric-label">Humidity</span>
                  <span class="metric-value">46%</span>
                </div>
                <div class="metric-card">
                  <span class="metric-label">Wind</span>
                  <span class="metric-value">14 km/h</span>
                </div>
                <div class="metric-card">
                  <span class="metric-label">Precipitation</span>
                  <span class="metric-value">0 mm</span>
                </div>
              </div>

              <div class="daily-forecast-section">
                <h3>Daily forecast</h3>
                <div class="daily-forecast-row" id="daily-forecast">

                </div>
              </div>
            </div>

            <div class="right-panel">
              <div class="hourly-header">
                <h3>Hourly forecast</h3>
                <button class="day-dropdown-btn">
                  Tuesday
                  <img
                    src="images/icon-dropdown.svg"
                    alt=""
                    width="10"
                    height="10"
                  />
                </button>
              </div>

              <div class="hourly-list">
                
              </div>
            </div>
          </div>
        </div>

        <div class="empty-state">
          <h2>Search for a city to see the weather</h2>
        </div>

        <div class="error-message hidden">
          
        </div>

      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
